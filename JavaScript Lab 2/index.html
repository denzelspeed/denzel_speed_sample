<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Lab 2</title>
</head>

<body>

    <h2>Exercise 1</h2>

    <label>Enter your interests separated by commas:</label>
    <br>
    <input type="text" id="interests">
    <button id="interestButton">Submit</button>

    <p id="interestOutput"></p>


    <h2>Exercise 2</h2>

    <label>Enter a complete address:</label>
    <br>
    <input type="text" id="address" size="50">

    <br><br>

    <label>Select a benchmark:</label>
    <br>
    <select id="benchmark"></select>

    <br><br>

    <button id="submitAddress">Submit</button>

    <p id="locationOutput"></p>

    <iframe
        id="map"
        width="600"
        height="450"
        style="border:0;"
        loading="lazy">
    </iframe>

    <script src="jscode.js"></script>

</body>
</html>
